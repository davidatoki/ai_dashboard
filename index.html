<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1620;
    --panel: #161F2C;
    --border: #26323F;
    --amber: #E8A33D;
    --teal: #5FA8A0;
    --text: #C9D1D9;
    --text-dim: #6B7785;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 0 20px;
  }
  header {
    padding: 28px 4px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    letter-spacing: 0.06em;
    color: var(--text);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .signal {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 0 0 rgba(95,168,160,0.5);
    animation: pulse 2.2s infinite;
  }
  .signal.thinking { background: var(--amber); animation: pulse-amber 0.9s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(95,168,160,0.45); }
    70% { box-shadow: 0 0 0 7px rgba(95,168,160,0); }
    100% { box-shadow: 0 0 0 0 rgba(95,168,160,0); }
  }
  @keyframes pulse-amber {
    0% { box-shadow: 0 0 0 0 rgba(232,163,61,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(232,163,61,0); }
    100% { box-shadow: 0 0 0 0 rgba(232,163,61,0); }
  }
  .sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 4px 12px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .empty {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.8;
  }
  .turn { display: flex; flex-direction: column; gap: 6px; max-width: 88%; }
  .turn.user { align-self: flex-end; align-items: flex-end; }
  .turn.agent { align-self: flex-start; align-items: flex-start; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .bubble {
    padding: 12px 14px;
    border-radius: 4px;
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .turn.user .bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .turn.agent .bubble {
    background: rgba(95,168,160,0.08);
    border: 1px solid rgba(95,168,160,0.25);
    color: var(--text);
  }
  .turn.agent .label { color: var(--teal); }
  .turn.user .label { color: var(--amber); }
  footer {
    padding: 16px 4px 24px;
    border-top: 1px solid var(--border);
  }
  form { display: flex; gap: 10px; }
  textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    padding: 12px 14px;
    line-height: 1.4;
    height: 46px;
    max-height: 140px;
  }
  textarea:focus {
    outline: none;
    border-color: var(--teal);
  }
  button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: var(--amber);
    color: #1a1206;
    border: none;
    border-radius: 4px;
    padding: 0 20px;
    cursor: pointer;
    font-weight: 700;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  .error {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #E8734F;
    padding: 8px 0 0;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title"><span class="signal" id="signal"></span> Agent Console</div>
      <div class="sub">gemini-2.5-flash</div>
    </header>

    <main id="messages">
      <div class="empty" id="empty">
        &gt; no transmissions yet<br />
        &gt; send a message to begin
      </div>
    </main>

    <footer>
      <form id="chatForm">
        <textarea id="input" placeholder="Ask the agent something..." rows="1"></textarea>
        <button type="submit" id="sendBtn">Send</button>
      </form>
      <div class="error" id="error" style="display:none;"></div>
    </footer>
  </div>

<script>
  const messagesEl = document.getElementById('messages');
  const emptyEl = document.getElementById('empty');
  const form = document.getElementById('chatForm');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const signal = document.getElementById('signal');
  const errorEl = document.getElementById('error');

  let history = []; // { role: 'user'|'assistant', text }

  function addTurn(role, text) {
    if (emptyEl) emptyEl.remove();
    const turn = document.createElement('div');
    turn.className = 'turn ' + (role === 'user' ? 'user' : 'agent');
    turn.innerHTML =
      '<div class="label">' + (role === 'user' ? 'you' : 'agent') + '</div>' +
      '<div class="bubble"></div>';
    turn.querySelector('.bubble').textContent = text;
    messagesEl.appendChild(turn);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return turn;
  }

  input.addEventListener('input', () => {
    input.style.height = '46px';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    errorEl.style.display = 'none';
    addTurn('user', message);
    history.push({ role: 'user', text: message });
    input.value = '';
    input.style.height = '46px';
    sendBtn.disabled = true;
    signal.classList.add('thinking');

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, history: history.slice(0, -1) }),
      });
      const data = await res.json();

      if (!res.ok || data.error) {
        throw new Error(data.error || 'Something went wrong.');
      }

      addTurn('assistant', data.reply);
      history.push({ role: 'assistant', text: data.reply });
    } catch (err) {
      errorEl.textContent = '> ' + err.message;
      errorEl.style.display = 'block';
    } finally {
      sendBtn.disabled = false;
      signal.classList.remove('thinking');
      input.focus();
    }
  });
</script>
</body>
</html>
